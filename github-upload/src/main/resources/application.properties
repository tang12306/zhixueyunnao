# 读取项目根目录的 .env（与 docker compose 共用一份，文件不存在时忽略）。
# 注意：.env 里的值不要加引号，Spring 会把引号当作值的一部分。
spring.config.import=optional:file:.env[.properties]
# .env 里的 SPRING_PROFILES_ACTIVE 不会自动生效（只有真正的环境变量才会），这里显式引用
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# 数据库连接配置
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:education_question_bank}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 表结构由 Flyway 管理（db/migration/V*.sql），Hibernate 只校验实体和表是否一致
# 以前靠 ddl-auto=update 建好表的库：首次启动时把现有结构记为 V1 基线，再执行 V2 起的脚本
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA配置
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 确保Hibernate正确处理表名和字段名
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# 服务器配置
server.port=8080
# 只信任内网代理（如本机 Nginx）传来的 X-Forwarded-* 头，用于取真实客户端 IP
server.forward-headers-strategy=native

# 会话 Cookie：前端通过同源代理访问，Lax 足够；上线 HTTPS 后把 COOKIE_SECURE 设为 true
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# 上传（题库、成绩导入）大小上限
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf配置
spring.thymeleaf.encoding=UTF-8

# 错误处理配置：错误响应里不带堆栈、异常类名和原始异常信息
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# 首个管理员账号：数据库里还没有 ADMIN 时，用这两个变量创建一次
app.bootstrap-admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}

# 允许跨域访问的前端地址（逗号分隔）。走同源代理时用不到，留给单独部署前端的情况
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8083}

# 登录失败锁定：同一用户名 + IP 连续失败次数上限与锁定时长
app.login.max-failures=5
app.login.lock-minutes=15

# AI 生成接口：每个用户每分钟最多调用次数
app.ai.rate-limit-per-minute=${AI_RATE_LIMIT_PER_MINUTE:5}

# API配置
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.key=${DEEPSEEK_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
