# 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/education_question_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 确保Hibernate正确处理表名和字段名
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# 服务器配置
server.port=8080

# Spring Security配置
# spring.security.user.name=${DEMO_TEACHER_USERNAME:demo.teacher}
# spring.security.user.password=${DEMO_TEACHER_PASSWORD:DemoTeacher123!}

# Thymeleaf配置
spring.thymeleaf.cache=false
# spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# 错误处理配置
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true

# API配置
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.key=${DEEPSEEK_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
