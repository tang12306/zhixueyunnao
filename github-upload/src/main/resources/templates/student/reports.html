<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成绩报告</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .report-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        .report-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .score-badge {
            font-size: 1.2em;
            padding: 8px 15px;
        }
        .chart-container {
            height: 300px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h2 class="mb-4">成绩报告</h2>

        <!-- 成绩统计图表 -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">成绩趋势</h5>
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 报告列表 -->
        <div class="row">
            <div th:each="report : ${reports}" class="col-md-6">
                <div class="card report-card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${report.score.exam.name}"></h5>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge bg-primary score-badge" th:text="${report.score.score + '分'}"></span>
                            <small class="text-muted" th:text="${#dates.format(report.score.createTime, 'yyyy-MM-dd HH:mm')}"></small>
                        </div>
                        <p class="card-text">
                            <i class="bi bi-graph-up"></i> 班级排名：
                            <span th:text="${report.score.rank != null ? report.score.rank + '名' : '暂无排名'}"></span>
                        </p>
                        <p class="card-text">
                            <i class="bi bi-file-text"></i> 反思报告：
                            <span th:text="${report.summary != null ? report.summary.substring(0, 50) + '...' : '暂无反思'}"></span>
                        </p>
                        <a th:href="@{/student/reflection/{id}(id=${report.id})}" class="btn btn-outline-primary">
                            查看详情
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 无报告提示 -->
        <div th:if="${reports.empty}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> 暂无成绩报告
        </div>

        <!-- 返回按钮 -->
        <div class="mt-4">
            <a th:href="@{/student/exams}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> 返回考试列表
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        // 准备图表数据
        const reportsData = /*[[${reports}]]*/ []; // Renamed to avoid conflict if 'reports' is a global var
        if (reportsData && reportsData.length > 0) {
            const examNames = reportsData.map(r => r.score && r.score.exam ? r.score.exam.name : '未知考试');
            const scores = reportsData.map(r => r.score ? r.score.score : 0);
            const ranks = reportsData.map(r => r.score && r.score.rank ? r.score.rank : null); // Allow null for ranks if not present

            // 创建图表
            const ctx = document.getElementById('scoreChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: examNames,
                    datasets: [{
                        label: '分数',
                        data: scores,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }, {
                        label: '排名',
                        data: ranks,
                        borderColor: 'rgb(255, 99, 132)',
                        tension: 0.1,
                        yAxisID: 'y1',
                        parsing: {
                            yAxisKey: 'y1'
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '分数'
                            }
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            reverse: true, // Lower rank number is better
                            title: {
                                display: true,
                                text: '排名'
                            },
                            grid: {
                                drawOnChartArea: false, // Only display grid for main y-axis
                            },
                            ticks: {
                                callback: function(value, index, values) {
                                    return value === null ? '' : value; // Handle null ranks in ticks
                                }
                            }
                        }
                    }
                }
            });
        } else {
            // Optional: Hide chart or show a message if no reportsData
            const chartContainer = document.querySelector('.chart-container');
            if(chartContainer) {
                chartContainer.innerHTML = '<p class="text-center text-muted">暂无成绩数据生成图表。</p>';
            }
        }
    </script>
</body>
</html>
