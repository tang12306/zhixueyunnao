<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的考试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .exam-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <!-- 学生信息卡片 -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">学生信息</h5>
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>姓名：</strong><span th:text="${currentUser.name}"></span></p>
                        <p><strong>学号：</strong><span th:text="${currentUser.username}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>班级：</strong><span th:text="${currentUser.studentClass != null ? currentUser.studentClass.name : '未分配'}"></span></p>
                        <p><strong>专业：</strong><span th:text="${currentUser.studentClass != null && currentUser.studentClass.major != null ? currentUser.studentClass.major.name : '未分配'}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 考试列表 -->
        <h3 class="mb-4">可参加的考试</h3>
        <div class="row">
            <div th:each="exam : ${exams}" class="col-md-6">
                <div class="card exam-card">
                    <div class="card-body">
                        <span class="badge bg-primary status-badge" th:text="${exam.status == 'ACTIVE' ? '进行中' : '未开始'}"></span>
                        <h5 class="card-title" th:text="${exam.name}"></h5>
                        <p class="card-text">
                            <small class="text-muted">
                                <i class="bi bi-clock"></i> 考试时长：<span th:text="${exam.duration}"></span>分钟
                            </small>
                        </p>
                        <p class="card-text">
                            <small class="text-muted">
                                <i class="bi bi-file-text"></i> 题目数量：<span th:text="${exam.questions != null ? exam.questions.size() : 0}"></span>题
                            </small>
                        </p>
                        <p class="card-text" th:text="${exam.description}"></p>
                        <a th:href="@{/student/exam/{id}(id=${exam.id})}" 
                           class="btn btn-primary" 
                           th:if="${exam.status == 'ACTIVE'}">
                            开始考试
                        </a>
                        <button class="btn btn-secondary" disabled th:if="${exam.status != 'ACTIVE'}">
                            暂未开始
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 无考试提示 -->
        <div th:if="${exams == null || exams.empty}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> 当前没有可参加的考试
        </div>

        <!-- 导航按钮 -->
        <div class="mt-4">
            <a th:href="@{/student/reports}" class="btn btn-outline-primary">
                <i class="bi bi-file-earmark-text"></i> 查看成绩报告
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
