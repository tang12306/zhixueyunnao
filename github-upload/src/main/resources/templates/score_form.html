<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>成绩录入 - 教务题库系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .header { background: #4CAF50; color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; }
        .main-content { max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        select { width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd; }
        .btn-group { margin-top: 1rem; display: flex; gap: 1rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: #4CAF50; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>成绩录入</h1>
        <a th:href="@{/scores}" style="color: white; text-decoration: none;">返回成绩管理</a>
    </div>
    <div class="main-content">
        <form th:action="@{/scores}" th:object="${score}" method="post">
            <div class="form-group">
                <label for="exam">考试</label>
                <select id="exam" th:field="*{exam}" required>
                    <option th:each="exam : ${exams}" th:value="${exam.id}" th:text="${exam.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="studentNumber">学号</label>
                <input type="text" id="studentNumber" th:field="*{studentNumber}" required>
            </div>
            <div class="form-group">
                <label for="studentName">姓名</label>
                <input type="text" id="studentName" th:field="*{studentName}" required>
            </div>
            <div class="form-group">
                <label for="score">分数</label>
                <input type="number" id="score" th:field="*{score}" min="0" max="150" step="0.01" required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">保存</button>
                <a th:href="@{/scores}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</body>
</html>
