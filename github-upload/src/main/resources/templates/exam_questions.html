<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>考试组卷 - 教务题库系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .header { background: #4CAF50; color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; }
        .main-content { max-width: 900px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; }
        .btn-group { margin-top: 1rem; display: flex; gap: 1rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: #4CAF50; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>考试组卷</h1>
        <a th:href="@{/exams}" style="color: white; text-decoration: none;">返回考试管理</a>
    </div>
    <div class="main-content">
        <form th:action="@{'/exams/' + ${exam.id} + '/questions'}" method="post">
            <table>
                <thead>
                    <tr>
                        <th>选择</th>
                        <th>ID</th>
                        <th>标题</th>
                        <th>类型</th>
                        <th>科目</th>
                        <th>难度</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="question : ${questions}">
                        <td>
                            <input type="checkbox" name="questionIds" th:value="${question.id}"
                                th:checked="${exam.questions.contains(question)}">
                        </td>
                        <td th:text="${question.id}">1</td>
                        <td th:text="${question.title}">题目标题</td>
                        <td th:text="${question.type}">单选题</td>
                        <td th:text="${question.subject}">数学</td>
                        <td th:text="${question.difficulty}">中等</td>
                    </tr>
                </tbody>
            </table>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">保存题目</button>
                <a th:href="@{/exams}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</body>
</html>
