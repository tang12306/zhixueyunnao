<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>考试编辑 - 教务题库系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .header { background: #4CAF50; color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; }
        .main-content { max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="date"] { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-group { margin-top: 1rem; display: flex; gap: 1rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: #4CAF50; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>考试编辑</h1>
        <a th:href="@{/exams}" style="color: white; text-decoration: none;">返回考试管理</a>
    </div>
    <div class="main-content">
        <form th:action="@{/exams}" th:object="${exam}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label for="name">考试名称</label>
                <input type="text" id="name" th:field="*{name}" required>
            </div>
            <div class="form-group">
                <label for="time">考试时间</label>
                <input type="text" id="time" th:field="*{time}" placeholder="如：2025-06-01" required>
            </div>
            <div class="form-group">
                <label for="subject">科目</label>
                <input type="text" id="subject" th:field="*{subject}" required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">保存</button>
                <a th:href="@{/exams}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</body>
</html>
