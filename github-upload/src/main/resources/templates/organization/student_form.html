<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout_admin}">
<head>
    <title th:text="${formTitle != null ? formTitle : '学生信息表单'}"></title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h4 th:text="${formTitle != null ? formTitle : '学生信息'}">学生信息</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

                        <form th:action="${formAction}" th:object="${student}" method="post">
                            <input type="hidden" th:field="*{id}"/>
                            <!-- 班级ID通过URL传递，并由Controller在保存时关联，这里不需要表单字段 -->
                            <!-- <input type="hidden" th:name="classId" th:value="${classEntity.id}"/> -->

                            <div class="mb-3">
                                <label for="username" class="form-label">学号 (用户名):</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required />
                                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="invalid-feedback d-block"></div>
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label">姓名:</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required />
                                 <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback d-block"></div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">密码:</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" th:placeholder="${student.id != null ? '留空则不修改密码' : '默认为学号'}" />
                                <small class="form-text text-muted">
                                    <span th:if="${student.id == null}">如果是新学生，不填写则默认密码与学号相同。</span>
                                    <span th:if="${student.id != null}">编辑学生时，不填写则不修改密码。</span>
                                </small>
                                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback d-block"></div>
                            </div>
                            
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> 保存
                                </button>
                                <a th:href="@{'/organization/classes/' + ${classEntity.id} + '/students'}" class="btn btn-outline-secondary">
                                    <i class="fas fa-times"></i> 取消
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
