<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <title>考试管理 - 教务题库系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .header { background: #4CAF50; color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; }
        .user-info { display: flex; align-items: center; gap: 1rem; }
        .logout-btn { background-color: transparent; border: 1px solid white; color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; }
        .logout-btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        .main-content { max-width: 1200px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
        .toolbar { display: flex; justify-content: space-between; margin-bottom: 1rem; }
        .add-btn { background: #4CAF50; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; }
        .action-btn { padding: 0.25rem 0.5rem; border: none; border-radius: 4px; cursor: pointer; margin-right: 0.5rem; }
        .edit-btn { background: #2196F3; color: #fff; }
        .delete-btn { background: #f44336; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>考试管理</h1>
        <div class="user-info">
            <span sec:authorize="isAuthenticated()" sec:authentication="name">用户名</span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn">退出登录</button>
            </form>
            <a th:href="@{/}" style="color: white; text-decoration: none; margin-left: 10px;">返回首页</a>
        </div>
    </div>
    <div class="main-content">
        <div class="toolbar">
            <button class="add-btn" onclick="location.href='/exams/new'">添加考试</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>考试名称</th>
                    <th>考试时间</th>
                    <th>科目</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="exam : ${exams}">
                    <td th:text="${exam.id}">1</td>
                    <td th:text="${exam.name}">期中考试</td>
                    <td th:text="${exam.time}">2025-06-01</td>
                    <td th:text="${exam.subject}">数学</td>
                    <td>
                        <button class="action-btn edit-btn" th:onclick="'location.href=\'/exams/edit/' + ${exam.id} + '\''">编辑</button>
                        <button class="action-btn delete-btn" th:onclick="'deleteExam(' + ${exam.id} + ')'">删除</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        function deleteExam(id) {
            if (confirm('确定要删除这场考试吗？')) {
                fetch('/exams/' + id, { method: 'DELETE' }).then(response => {
                    if (response.ok) { location.reload(); }
                    else { alert('删除失败，请重试'); }
                });
            }
        }
    </script>
</body>
</html>
