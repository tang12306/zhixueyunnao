<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <title>统计分析 - 江苏师范大学教务题库系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .header { background: #4CAF50; color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; }
        .user-info { display: flex; align-items: center; gap: 1rem; }
        .logout-btn { background-color: transparent; border: 1px solid white; color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; }
        .logout-btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        .main-content { max-width: 1000px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; border-bottom: 1px solid #eee; text-align: center; }
        th { background: #f8f9fa; }
        .charts { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; margin: 2rem 0; }
        .chart-box { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>统计分析</h1>
        <div class="user-info">
            <span sec:authorize="isAuthenticated()" sec:authentication="name">用户名</span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn">退出登录</button>
            </form>
            <a th:href="@{/}" style="color: white; text-decoration: none; margin-left: 10px;">返回首页</a>
        </div>
    </div>
    <div class="main-content">
        <h2 style="text-align:center; color:#4CAF50;">各场考试成绩统计</h2>
        <div class="charts">
            <div class="chart-box">
                <div id="scoreBar" style="width:400px;height:300px;"></div>
            </div>
            <div class="chart-box">
                <div id="passLine" style="width:400px;height:300px;"></div>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>考试名称</th>
                    <th>成绩人数</th>
                    <th>平均分</th>
                    <th>最高分</th>
                    <th>最低分</th>
                    <th>及格率(%)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stat : ${statsList}">
                    <td th:text="${stat[0]}">考试名称</td>
                    <td th:text="${stat[1]}">0</td>
                    <td th:text="${stat[2]}">0</td>
                    <td th:text="${stat[3]}">0</td>
                    <td th:text="${stat[4]}">0</td>
                    <td th:text="${stat[5]}">0</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script th:inline="javascript">
        // 准备数据
        var statsList = /*[[${statsList}]]*/ [];
        var examNamesArr = statsList.map(function(s){return s[0];});
        var avgScoresArr = statsList.map(function(s){return parseFloat(s[2]);});
        var passRatesArr = statsList.map(function(s){return parseFloat(s[5]);});
        // 分数分布柱状图
        var scoreBar = echarts.init(document.getElementById('scoreBar'));
        scoreBar.setOption({
            title: { text: '各考试平均分', left: 'center' },
            tooltip: {},
            xAxis: { type: 'category', data: examNamesArr },
            yAxis: { type: 'value', name: '平均分' },
            series: [{ name: '平均分', type: 'bar', data: avgScoresArr }]
        });
        // 及格率趋势折线图
        var passLine = echarts.init(document.getElementById('passLine'));
        passLine.setOption({
            title: { text: '各考试及格率', left: 'center' },
            tooltip: {},
            xAxis: { type: 'category', data: examNamesArr },
            yAxis: { type: 'value', name: '及格率(%)', min: 0, max: 100 },
            series: [{ name: '及格率', type: 'line', data: passRatesArr }]
        });
    </script>
</body>
</html>
