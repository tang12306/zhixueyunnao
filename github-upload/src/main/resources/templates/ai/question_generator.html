<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能出题 - 教务题库系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet">
    <style>
        .preview-card {
            margin-top: 20px;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .tag-container {
            margin-top: 10px;
        }
        .tag {
            display: inline-block;
            background: #e9ecef;
            padding: 5px 10px;
            border-radius: 15px;
            margin: 3px;
            cursor: pointer;
        }
        .tag .remove {
            margin-left: 5px;
            color: #666;
        }
        .tag .remove:hover {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">AI 智能出题</h2>
        
        <!-- 出题表单 -->
        <div class="card">
            <div class="card-body">
                <form id="questionForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="subject" class="form-label">科目</label>
                            <select class="form-select" id="subject" name="subject" required>
                                <option value="">请选择科目</option>
                                <option value="语文">语文</option>
                                <option value="数学">数学</option>
                                <option value="英语">英语</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="type" class="form-label">题型</label>
                            <select class="form-select" id="type" name="type" required>
                                <option value="">请选择题型</option>
                                <option value="选择题">选择题</option>
                                <option value="填空题">填空题</option>
                                <option value="简答题">简答题</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="difficulty" class="form-label">难度</label>
                            <select class="form-select" id="difficulty" name="difficulty">
                                <option value="1">简单</option>
                                <option value="2">较简单</option>
                                <option value="3" selected>中等</option>
                                <option value="4">较难</option>
                                <option value="5">困难</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="count" class="form-label">生成数量</label>
                            <input type="number" class="form-control" id="count" name="count" 
                                   min="1" max="10" value="1">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="topic" class="form-label">主题/知识点</label>
                        <input type="text" class="form-control" id="topic" name="topic" 
                               placeholder="例如：古诗词鉴赏、函数与导数等">
                    </div>

                    <div class="mb-3">
                        <label for="tagInput" class="form-label">标签</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="tagInput" 
                                   placeholder="输入标签后按回车添加">
                            <button class="btn btn-outline-secondary" type="button" id="addTag">添加</button>
                        </div>
                        <div class="tag-container" id="tagContainer"></div>
                        <input type="hidden" id="tags" name="tags">
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary" id="generateBtn">
                            生成题目
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 加载提示 -->
        <div class="loading" id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">正在生成题目，请稍候...</p>
        </div>

        <!-- 预览区域 -->
        <div class="preview-card card" id="previewCard">
            <div class="card-header">
                <h5 class="card-title mb-0">生成的题目</h5>
            </div>
            <div class="card-body" id="previewContent">
                <!-- 题目预览内容将在这里动态生成 -->
            </div>
            <div class="card-footer">
                <button class="btn btn-success" id="saveBtn">保存题目</button>
                <button class="btn btn-secondary" id="regenerateBtn">重新生成</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            let currentQuestions = [];
            const tags = new Set();

            // 添加标签
            function addTag(tag) {
                if (tag && !tags.has(tag)) {
                    tags.add(tag);
                    updateTagDisplay();
                }
                $('#tagInput').val('');
            }

            // 更新标签显示
            function updateTagDisplay() {
                const container = $('#tagContainer');
                container.empty();
                tags.forEach(tag => {
                    container.append(`
                        <span class="tag">
                            ${tag}
                            <span class="remove">&times;</span>
                        </span>
                    `);
                });
                $('#tags').val(Array.from(tags).join(','));
            }

            // 添加标签事件
            $('#addTag').click(() => addTag($('#tagInput').val().trim()));
            $('#tagInput').keypress(function(e) {
                if (e.which === 13) {
                    e.preventDefault();
                    addTag($(this).val().trim());
                }
            });

            // 删除标签
            $(document).on('click', '.tag .remove', function() {
                const tag = $(this).parent().text().trim();
                tags.delete(tag);
                updateTagDisplay();
            });

            // 生成题目
            $('#questionForm').submit(function(e) {
                e.preventDefault();
                const formData = {
                    subject: $('#subject').val(),
                    type: $('#type').val(),
                    difficulty: $('#difficulty').val(),
                    topic: $('#topic').val(),
                    tags: Array.from(tags),
                    count: $('#count').val()
                };

                $('#loading').show();
                $('#previewCard').hide();
                $('#generateBtn').prop('disabled', true);

                $.ajax({
                    url: '/api/ai/generate-question',
                    method: 'POST',
                    data: formData,
                    success: function(response) {
                        if (response.success) {
                            currentQuestions = response.questions;
                            displayQuestions(response.questions);
                        } else {
                            alert('生成题目失败：' + response.message);
                        }
                    },
                    error: function(xhr) {
                        alert('生成题目失败：' + (xhr.responseJSON?.message || '服务器错误'));
                    },
                    complete: function() {
                        $('#loading').hide();
                        $('#generateBtn').prop('disabled', false);
                    }
                });
            });

            // 显示生成的题目
            function displayQuestions(questions) {
                const container = $('#previewContent');
                container.empty();

                questions.forEach((question, index) => {
                    const questionHtml = `
                        <div class="question mb-4">
                            <h5>题目 ${index + 1}</h5>
                            <p class="content">${question.content}</p>
                            ${question.options ? `
                                <div class="options">
                                    ${question.options.map((opt, i) => `
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="q${index}" value="${i}">
                                            <label class="form-check-label">${opt}</label>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            <div class="answer mt-2">
                                <strong>答案：</strong> ${question.answer}
                            </div>
                            <div class="analysis mt-2">
                                <strong>解析：</strong> ${question.analysis}
                            </div>
                        </div>
                    `;
                    container.append(questionHtml);
                });

                $('#previewCard').show();
            }

            // 保存题目
            $('#saveBtn').click(function() {
                if (!currentQuestions || currentQuestions.length === 0) {
                    alert('没有可保存的题目');
                    return;
                }

                // 为每个题目添加表单数据
                const questionsToSave = currentQuestions.map(q => ({
                    ...q,
                    subject: $('#subject').val(),
                    type: $('#type').val(),
                    difficulty: parseInt($('#difficulty').val()),
                    tags: Array.from(tags)
                }));

                $.ajax({
                    url: '/api/ai/save-questions',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(questionsToSave),
                    success: function(response) {
                        if (response.success) {
                            alert(response.message);
                            // 可以选择清空表单或保持当前状态
                            // $('#questionForm')[0].reset();
                            // tags.clear();
                            // updateTagDisplay();
                        } else {
                            alert('保存失败：' + response.message);
                        }
                    },
                    error: function(xhr) {
                        alert('保存失败：' + (xhr.responseJSON?.message || '服务器错误'));
                    }
                });
            });

            // 重新生成
            $('#regenerateBtn').click(function() {
                $('#questionForm').submit();
            });
        });
    </script>
</body>
</html>
