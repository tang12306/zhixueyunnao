# 测试使用 H2 内存数据库（MySQL 兼容模式），不依赖本机 MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# 迁移脚本是 MySQL 语法，H2 上由 Hibernate 直接建表；脚本本身用真实 MySQL 验证
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

deepseek.api.key=
app.bootstrap-admin.username=
app.bootstrap-admin.password=
