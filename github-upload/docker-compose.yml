name: education-question-bank

services:
  # MongoDB 数据库 - 用于 Node.js 后端
  mongodb:
    image: mongo:5.0
    container_name: education-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: education-question-bank
    volumes:
      - mongodb_data:/data/db
    networks:
      - education-network

  # MySQL 数据库 - 用于 Spring Boot 后端
  mysql:
    image: mysql:8.0
    container_name: education-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
      MYSQL_DATABASE: education_question_bank
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - education-network



volumes:
  mongodb_data:
    driver: local
  mysql_data:
    driver: local

networks:
  education-network:
    driver: bridge
