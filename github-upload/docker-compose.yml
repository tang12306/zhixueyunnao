name: education-question-bank

services:
  # MySQL 数据库 - Spring Boot 后端使用
  mysql:
    image: mysql:8.0
    container_name: education-mysql
    restart: unless-stopped
    # 只绑定本机地址，数据库端口不对外网开放
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
      MYSQL_DATABASE: education_question_bank
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - education-network

volumes:
  mysql_data:
    driver: local

networks:
  education-network:
    driver: bridge
